<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아기 사자 대시보드</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page-wrapper">
        <h1 class="page-title">멋쟁이사자처럼 아기 사자 명단</h1>

        <div class="control-bar">
            <button class="btn" id="toggleFormBtn">아기 사자 추가</button>
            <button class="btn" id="deleteLastBtn">마지막 아기 사자 삭제</button>
            <span class="total-count" id="totalCount">총 0명</span>
        </div>

        <!-- 입력 폼 섹션 -->
        <section class="form-container" id="formContainer" style="display: none;">
            <form id="memberForm" class="member-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>이름</label>
                        <input type="text" id="name" placeholder="예: 홍아기사자" required>
                    </div>
                    <div class="form-group">
                        <label>파트</label>
                        <select id="part" required>
                            <option value="Frontend">Frontend</option>
                            <option value="Backend">Backend</option>
                            <option value="Design">Design</option>
                            <option value="PM">PM</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>관심 기술 (쉼표로 구분)</label>
                    <input type="text" id="skills" placeholder="예: JavaScript, React, HTML/CSS" required>
                </div>

                <div class="form-group">
                    <label>한 줄 소개 (요약 카드)</label>
                    <input type="text" id="intro" placeholder="예: 3주차 DOM 조작 연습 중!" required>
                </div>

                <div class="form-group">
                    <label>자기소개 (상세 카드)</label>
                    <textarea id="fullIntro" placeholder="예: HTML/CSS로 구조를 만들고..." required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="예: lion@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" id="phone" placeholder="예: 010-1234-5678" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Website</label>
                    <input type="url" id="website" placeholder="예: https://example.com" required>
                </div>

                <div class="form-group">
                    <label>한 마디</label>
                    <input type="text" id="motto" placeholder="예: 데이터 바꾸면 화면도 바뀐다!" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-submit">추가하기</button>
                    <button type="button" class="btn btn-cancel" id="cancelBtn">취소</button>
                </div>
            </form>
        </section>

        <!-- 요약 카드 그리드 -->
        <section class="summary-grid" id="summaryGrid"></section>

        <!-- 상세 리스트 -->
        <section class="detail-list-container">
            <h2 class="section-title">아기 사자 상세 프로필</h2>
            <div id="detailList"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
